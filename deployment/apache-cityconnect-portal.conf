# Apache configuration for the CityConnect citizen portal.
#
# A SEPARATE VIRTUAL HOST, not a path on the staff host. That is the whole
# point of the split: a distinct origin means a distinct cookie jar, so script
# running on the public site has no ambient authority over a staff session in
# the same browser. Serving it at /portal on the console's host would keep the
# bundles apart but leave that risk in place.
#
# This host is also **the only surface C2 talks to**. C2 is an external system
# and cannot reach the API's listening port — in most deployments the console's
# host is not reachable from outside either. Every inbound C2 endpoint is
# therefore published here and proxied on, and the API port stays bound to
# loopback (CC_ADDR=127.0.0.1:4021, the production default).
#
# That binding is what makes the rules below meaningful. An API listening on a
# public interface can be reached directly, and every Require here is then
# decoration: the staff surface would be exposed regardless of what this file
# says. If you change CC_ADDR, you are changing the security model.
#
# The API is proxied here as well as on the staff host, so both apps call /api
# on their own origin and neither session cookie needs SameSite=None — which
# would weaken CSRF protection on both.

<VirtualHost *:443>
    ServerName services.example.gov

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile as issued for this host.

    DocumentRoot /var/www/cityconnect-portal

    # --- API (same origin as this app) -----------------------------------
    ProxyPass        /api  http://127.0.0.1:4021/api  connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse /api  http://127.0.0.1:4021/api

    <Location /api>
        RequestHeader set X-Forwarded-Proto "https"
        ProxyPreserveHost On
        Header always set Cache-Control "no-store"
    </Location>

    # --- What this origin is allowed to expose ----------------------------
    #
    # Default deny, then allow exactly three groups. The API enforces its own
    # authorisation regardless — a portal cookie is refused everywhere outside
    # /api/portal, and every C2 endpoint verifies a signed assertion — but a
    # public origin should not even be able to *reach* the staff surface.
    <Location /api>
        Require all denied
    </Location>

    # 1. The citizen portal's own API, and the sign-in callback the browser
    #    returns to after C2.
    <Location /api/portal>
        Require all granted
    </Location>
    <Location /api/auth/callback>
        Require all granted
    </Location>

    # 2. The Service Card callout. C2 calls this server-to-server and
    #    authenticates with a short-lived RS256 assertion verified against its
    #    own JWKS, so it is safe to publish and must be publicly reachable.
    <LocationMatch "^/api/citizens/[^/]+/status$">
        Require all granted
    </LocationMatch>

    # 3. Back-channel logout, and the JWKS C2 fetches to verify the client
    #    assertions on our partner notification calls.
    <Location /api/c2/backchannel-logout>
        Require all granted
    </Location>
    <Location /api/c2/jwks>
        Require all granted
    </Location>

    # --- SPA --------------------------------------------------------------
    <Directory /var/www/cityconnect-portal>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        <FilesMatch "\.(js|css|woff2?|png|jpg|svg|webp)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "index\.html$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>

        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </Directory>

    # --- Security headers -------------------------------------------------
    #
    # Stricter than the console's, because this origin is public and its
    # content includes text that citizens themselves wrote.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()"

    Header always set Content-Security-Policy "default-src 'self'; \
        script-src 'self'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data:; \
        font-src 'self'; \
        connect-src 'self'; \
        frame-ancestors 'none'; \
        form-action 'self'; \
        base-uri 'self'; \
        object-src 'none'"
</VirtualHost>
