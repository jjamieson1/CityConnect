# Apache configuration for CityConnect.
#
# Apache serves the SPA from /cityconnect/ and reverse-proxies
# /cityconnect/api to the Go service on 127.0.0.1:4021, stripping the
# /cityconnect prefix so the API sees the paths it actually routes.
#
# Enable first:
#   a2enmod proxy proxy_http headers rewrite deflate expires
#
# Include this inside the site's <VirtualHost *:443> block.

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------

# The prefix is stripped here: the service routes /api/..., not
# /cityconnect/api/..., and the SPA's base path is a deployment concern.
ProxyPass        /cityconnect/api  http://127.0.0.1:4021/api  connectiontimeout=5 timeout=120 retry=0
ProxyPassReverse /cityconnect/api  http://127.0.0.1:4021/api

# Health and readiness, for monitoring. Restrict these if the site is public.
ProxyPass        /cityconnect/healthz  http://127.0.0.1:4021/healthz
ProxyPassReverse /cityconnect/healthz  http://127.0.0.1:4021/healthz
ProxyPass        /cityconnect/readyz   http://127.0.0.1:4021/readyz
ProxyPassReverse /cityconnect/readyz   http://127.0.0.1:4021/readyz

<Location /cityconnect/api>
    # The service resolves the caller's address from these, for rate limiting
    # and audit entries. Without them every request appears to come from the
    # proxy itself.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # The Service Card callout arrives from C2 server-to-server and carries a
    # bearer assertion; it must not be cached anywhere.
    Header always set Cache-Control "no-store"
</Location>

# Metrics are for the monitoring system, not the public internet.
<Location /cityconnect/metrics>
    ProxyPass  http://127.0.0.1:4021/metrics
    Require ip 127.0.0.1 10.0.0.0/8
</Location>

# ---------------------------------------------------------------------------
# SPA
# ---------------------------------------------------------------------------

Alias /cityconnect /var/www/cityconnect

<Directory /var/www/cityconnect>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /cityconnect/

    # Anything that is not a real file falls through to index.html, so the
    # client-side router owns deep links like /cityconnect/requests/<id>.
    # The API is excluded: a 404 there must stay a 404, not become HTML.
    RewriteCond %{REQUEST_URI} !^/cityconnect/api
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /cityconnect/index.html [L]

    # Hashed assets are immutable; index.html must never be, or a release
    # leaves browsers loading a stale shell against a new API.
    <FilesMatch "\.(js|css|woff2?|png|jpg|svg|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</Directory>

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

<Location /cityconnect>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # The SPA loads only its own assets and calls only its own API. The C2
    # portal origin needs no entry here: the browser is redirected to it as a
    # top-level navigation, never fetched from within the page.
    Header always set Content-Security-Policy "default-src 'self'; \
        script-src 'self'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data:; \
        font-src 'self'; \
        connect-src 'self'; \
        frame-ancestors 'none'; \
        base-uri 'self'; \
        form-action 'self'"
</Location>
